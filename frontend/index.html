<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Reliability Explorer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"></circle><circle cx="4" cy="6" r="2"></circle>
        <circle cx="20" cy="6" r="2"></circle><circle cx="5" cy="19" r="2"></circle>
        <circle cx="19" cy="19" r="2"></circle>
        <path d="M6 7l4 3.5M18 7l-4 3.5M6.5 17.5l3.5-3M17.5 17.5l-3.5-3"></path>
      </svg>
      <span>Fleet Reliability Explorer</span>
    </div>
    <form class="search" id="search-form" autocomplete="off" role="search">
      <svg viewBox="0 0 24 24" class="search-icon" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
      <input id="search-input" type="search" placeholder="Search by tail, defect #, serial #, part, vendor, station, or ask a question…" aria-label="Search">
      <div class="search-results" id="search-results" role="listbox" hidden></div>
    </form>
    <div class="env" id="env-badge"></div>
  </header>

  <div class="layout">
    <nav class="sidenav" aria-label="Sections">
      <a href="#/" data-nav="home"><span class="nav-ico" data-icon="search"></span>Search</a>
      <a href="#/list/aircraft" data-nav="aircraft"><span class="nav-ico" data-icon="aircraft"></span>Aircraft</a>
      <a href="#/list/defect" data-nav="defect"><span class="nav-ico" data-icon="defect"></span>Defects</a>
      <a href="#/list/deferral" data-nav="deferral"><span class="nav-ico" data-icon="deferral"></span>MEL Deferrals</a>
      <a href="#/list/workOrder" data-nav="workOrder"><span class="nav-ico" data-icon="workOrder"></span>Work Orders</a>
      <a href="#/list/removal" data-nav="removal"><span class="nav-ico" data-icon="removal"></span>Removals</a>
      <a href="#/list/component" data-nav="component"><span class="nav-ico" data-icon="component"></span>Components</a>
      <a href="#/list/part" data-nav="part"><span class="nav-ico" data-icon="part"></span>Parts</a>
      <a href="#/list/vendor" data-nav="vendor"><span class="nav-ico" data-icon="vendor"></span>Vendors</a>
      <a href="#/list/station" data-nav="station"><span class="nav-ico" data-icon="station"></span>Stations</a>
      <a href="#/list/flight" data-nav="flight"><span class="nav-ico" data-icon="flight"></span>Flights Impacted</a>
      <a href="#/list/directive" data-nav="directive"><span class="nav-ico" data-icon="directive"></span>Directives</a>
      <div class="nav-sep"></div>
      <a href="#/questions" data-nav="questions"><span class="nav-ico" data-icon="questions"></span>Competency Questions</a>
      <a href="#/ask" data-nav="ask" id="nav-ask"><span class="nav-ico" data-icon="ask"></span>Ask a Question</a>
      <div class="nav-foot">Synthetic data · Bluebonnet Air (fictional)</div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
